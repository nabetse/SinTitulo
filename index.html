<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcance · Sin Título</title>
<meta name="description" content="Mapa de alcance de Sin Título: las emisoras que transmiten hacia CreaTV y las organizaciones invitadas a crear otras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#E9EDE4; }
  .al *, .al *::before, .al *::after { box-sizing:border-box; }
  .al {
    --papel:#E9EDE4; --tierra:#DFE5D8; --tinta:#16241E; --suave:#5C6B5F; --linea:rgba(22,36,30,.14);
    --verde:#0F7B5A; --naranja:#C9500F; --azul:#2D5FA8; --gris:#8A968C;
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--tinta); background:var(--papel);
    height:100%; min-height:420px; display:flex; flex-direction:column; position:relative; overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  .al-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    padding:16px 20px 10px; flex:none; }
  .al-head h2 { margin:0; font-size:clamp(19px,2.8vw,26px); font-weight:600; letter-spacing:-.4px; line-height:1.15; }
  .al-head p { margin:4px 0 0; font-size:13.5px; font-weight:300; color:var(--suave); }
  .al-propia { font-size:13px; color:var(--suave); text-decoration:none; white-space:nowrap;
    border:1.5px solid rgba(22,36,30,.22); border-radius:999px; padding:6px 13px; display:none; }
  .al-propia:hover { color:var(--tinta); border-color:var(--tinta); }
  .al-embebido .al-propia { display:inline-block; }

  .al-stage { position:relative; flex:1 1 auto; min-height:0; }
  .al-stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .al-punto { cursor:pointer; }
  .al-punto:focus { outline:none; }
  .al-punto:focus-visible .al-anillo-foco { stroke:var(--tinta); }
  .al-etq { font-size:12px; font-weight:500; fill:var(--tinta); paint-order:stroke; stroke:var(--papel);
    stroke-width:4px; stroke-linejoin:round; pointer-events:none; }
  .al-etq-centro { font-size:13.5px; font-weight:600; }
  .al-depto { font-size:8.5px; font-style:italic; font-weight:300; fill:#5C6B5F; opacity:.75;
    letter-spacing:.3px; pointer-events:none; }
  .al-etq-chica { font-size:10.5px; font-weight:400; }
  .al-etq-sub { font-size:11px; font-weight:300; fill:var(--suave); }

  .al-onda { fill:none; stroke-width:1.4; transform-box:fill-box; transform-origin:center;
    animation:al-onda 3.6s cubic-bezier(.2,.6,.3,1) infinite; opacity:0; }
  .al-onda:nth-of-type(2) { animation-delay:1.2s; }
  .al-onda:nth-of-type(3) { animation-delay:2.4s; }
  @keyframes al-onda { 0% { transform:scale(.25); opacity:.75; } 100% { transform:scale(1); opacity:0; } }
  .al-ruta-viva { stroke-dasharray:2 10; animation:al-flujo 1.6s linear infinite; }
  @keyframes al-flujo { to { stroke-dashoffset:-12; } }
  @media (prefers-reduced-motion: reduce) {
    .al-onda { animation:none; opacity:.35; transform:scale(.7); }
    .al-ruta-viva { animation:none; }
  }

  .al-pie { flex:none; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;
    padding:8px 20px 14px; font-size:12.5px; font-weight:300; color:var(--suave); }
  .al-clave { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .al-clave svg { flex:none; }
  .al-cuenta { margin-left:auto; white-space:nowrap; }

  .al-aviso { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); max-width:min(420px,86%);
    text-align:center; font-size:14px; font-weight:300; color:var(--suave); background:rgba(233,237,228,.9);
    padding:14px 18px; border-radius:12px; display:none; }
  .al-aviso b { display:block; color:var(--tinta); font-weight:500; margin-bottom:4px; }

  .al-panel { position:absolute; right:12px; top:12px; width:min(300px,calc(100% - 24px));
    max-height:calc(100% - 24px); overflow:auto; background:#fff; border-radius:14px;
    padding:16px 18px 18px; box-shadow:0 10px 32px rgba(22,36,30,.18); display:none; font-size:13.5px; }
  .al-panel.al-on { display:block; }
  .al-panel h3 { margin:0 26px 2px 0; font-size:17px; font-weight:600; line-height:1.25; }
  .al-panel .al-lugar { margin:0 0 10px; color:var(--suave); font-weight:300; }
  .al-panel dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .al-panel dt { color:var(--suave); font-weight:300; }
  .al-panel dd { margin:0; overflow-wrap:anywhere; }
  .al-panel a { color:var(--azul); }
  .al-panel .al-sep { border:0; border-top:1px solid var(--linea); margin:14px 0; }
  .al-cerrar { position:absolute; right:10px; top:8px; border:0; background:none; font:inherit;
    font-size:22px; line-height:1; color:var(--suave); cursor:pointer; padding:4px 6px; }
  .al-pastilla { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; color:#fff; }

  @media (max-width:560px) {
    .al-head { padding:12px 14px 6px; }
    .al-pie { padding:6px 14px 10px; gap:4px 12px; font-size:12px; }
    .al-cuenta { margin-left:0; width:100%; }
    .al-etq { font-size:13px; }
  }
</style>
</head>
<body>
<div class="al" id="al">
  <div class="al-head">
    <div>
      <h2>Alcance</h2>
      <p id="al-sub">Emisoras de <i>Sin Título</i> y las rutas de su señal hacia CreaTV</p>
    </div>
    <a class="al-propia" id="al-propia" href="https://nabetse.github.io/SinTitulo/" target="_blank" rel="noopener">Abrir el mapa aparte ↗</a>
  </div>

    <svg id="al-svg" role="img" aria-labelledby="al-titulo-svg" preserveAspectRatio="xMidYMid meet">
      <title id="al-titulo-svg">Mapa de América acostado, con la costa del Pacífico abajo, y las rutas de las emisoras hacia CreaTV en San José, California</title>

    <div class="al-aviso" id="al-aviso"></div>
    <div class="al-panel" id="al-panel" role="dialog" aria-live="polite">
      <button class="al-cerrar" id="al-cerrar" aria-label="Cerrar">×</button>
      <div id="al-panel-cuerpo"></div>
    </div>
  </div>

  <div class="al-pie" id="al-pie"></div>
</div>

      .sort(function (a, b) { return ORDEN.indexOf(a.estado) - ORDEN.indexOf(b.estado); })

  function pie(orgs) {

  function clave(estado, texto) {

    else if (estado === "contactada") s = "<circle cx='19' cy='8' r='3.6' fill='" + c + "'/>";
    else s = "<circle cx='19' cy='8' r='3.4' fill='#fff' stroke='" + c + "' stroke-width='1.5'/>";
    return "<span class='al-clave'><svg width='24' height='16' viewBox='0 0 24 16' aria-hidden='true'>" + s + "</svg>" + esc(texto) + "</span>";
  }

  /* ---------- panel ---------- */

  function abrible(g, lista) {
    function abrir() { mostrar(lista); }
    g.addEventListener("click", function (ev) { ev.stopPropagation(); abrir(); });
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(); }
    });
  }

  function mostrar(lista) {
    var h = "";
    lista.forEach(function (o, i) {
      if (i) h += "<hr class='al-sep'>";
      h += "<h3>" + esc(o.nombre) + "</h3>";
      h += "<p class='al-lugar'>" + esc(o.lugar || "") + "</p>";
      if (o.centro) {
        h += "<dl><dt>Papel</dt><dd>Adonde llegan las rutas</dd></dl>";
        return;
      }
      var web = enlaceSeguro(o.web), tx = enlaceSeguro(o.enlace);
      h += "<dl>";
      h += "<dt>Estado</dt><dd><span class='al-pastilla' style='background:" + COLOR[o.estado] + "'>" +
           esc(NOMBRE_ESTADO[o.estado]) + "</span></dd>";
      if (o.fecha) h += "<dt>Emisora desde</dt><dd>" + esc(o.fecha) + "</dd>";
      if (tx) h += "<dt>Transmisiones</dt><dd><a href='" + esc(tx) + "' target='_blank' rel='noopener'>Ver ↗</a></dd>";
      if (web) h += "<dt>Web</dt><dd><a href='" + esc(web) + "' target='_blank' rel='noopener'>" +
                    esc(web.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")) + "</a></dd>";
      if (o.destino) h += "<dt>Transmite a</dt><dd>" + esc(o.destino) + "</dd>";
      h += "</dl>";
    });
    cuerpo.innerHTML = h;
    panel.classList.add("al-on");
  }
  q("al-cerrar").addEventListener("click", function () { panel.classList.remove("al-on"); });
  svg.addEventListener("click", function () { panel.classList.remove("al-on"); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") panel.classList.remove("al-on"); });

  /* ---------- carga ---------- */

  function decir(titulo, detalle) {
    aviso.innerHTML = "<b>" + esc(titulo) + "</b>" + esc(detalle || "");
    aviso.style.display = "block";
  }

  function construir(datos) {
    if (!datos || datos.error) {
      dibujar({});
      decir("No pude leer la hoja.", datos && datos.error ? datos.error : "");
      return;
    }
    aviso.style.display = "none";
    dibujar(datos);
    if (!(datos.organizaciones || []).length)
      decir("Todavía no hay organizaciones en el mapa.", "Aparecen aquí a medida que se suman.");
  }

  function jsonp(url) {
    var nombre = "alcb" + Date.now(), s = document.createElement("script"), listo = false;
    window[nombre] = function (d) { listo = true; limpiar(); construir(d); };
    function limpiar() { try { delete window[nombre]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function () { limpiar(); construir({ error:"La API no respondió." }); };
    setTimeout(function () { if (!listo) { limpiar(); construir({ error:"La API tardó demasiado." }); } }, 20000);
    s.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + nombre;
    document.body.appendChild(s);
  }

  function cargar() {
    // ?api=… sirve para probar otra implementación sin tocar el archivo.
    var m = /[?&]api=([^&]+)/.exec(location.search);
    var url = m ? decodeURIComponent(m[1]) : API;
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) {
      dibujar({});
      return;
    }
    fetch(url, { redirect:"follow" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(construir)
      .catch(function () { jsonp(url); });
  }

  window.alcanceDibujar = construir;   // para pruebas locales
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(cargar); else cargar();
})();
</script>
